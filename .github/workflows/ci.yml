name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run test:coverage
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t prompthole:ci .
      - name: Container starts and answers
        run: |
          docker run -d --name prompthole -p 127.0.0.1:8787:8787 prompthole:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8787/api/stats && exit 0; sleep 1; done
          docker logs prompthole; exit 1
